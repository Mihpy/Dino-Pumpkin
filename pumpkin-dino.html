<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тыква-динозаврик</title>
<style>
:root { color-scheme: light dark; }
body { margin:0; padding:16px; font: 400 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; background:#f6f7f9; color:#1c2430; display:flex; justify-content:center; }
#stage { width:100%; max-width:900px; }
.viz-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.viz-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.btn { border:1px solid #c6ccd4; background:#fff; color:#1c2430; border-radius:8px; padding:4px 12px; font:inherit; cursor:pointer; }
.btn:hover { background:#eef1f5; }
.text-muted { color:#5a6472; }
.text-small { font-size:12px; }
.tabular-nums { font-variant-numeric: tabular-nums; }
strong { font-weight:500; }
@media (prefers-color-scheme: dark) {
  body { background:#12161c; color:#e8ebef; }
  .btn { background:#1c222b; border-color:#39414d; color:#e8ebef; }
  .btn:hover { background:#262d38; }
  .text-muted { color:#9aa4b2; }
  .pd-shortcuts { background:#1c222b; border-color:#39414d; color:#b5bfcc; }
  .pd-shortcuts-title { color:#e8ebef; }
  .pd-shortcut kbd { background:#262d38; border-color:#4a5564; color:#e8ebef; }
}
</style>
</head>
<body>
<div id="stage">
<div id="pumpkin-dino-root">
  <div class="viz-controls" style="justify-content:space-between;align-items:center">
    <div class="viz-row" style="gap:16px">
      <span>Счёт <strong class="tabular-nums" id="pd-score" style="color:#ff8f2b">0</strong></span>
      <span class="text-muted">Рекорд <span class="tabular-nums" id="pd-best">0</span></span>
      <span style="color:#1f4fd8">Множитель <strong class="tabular-nums" id="pd-mult">×1.0</strong></span>
    </div>
    <button type="button" class="btn btn-sm" id="pd-restart">Заново</button>
  </div>
  <canvas id="pd-canvas" style="width:100%;height:400px;display:block;border-radius:var(--radius-lg);touch-action:none" role="img" aria-label="Игра: тыква катится по дороге через город, поля и лес, прыгай через столбы с камерами и не попадай в зоны наблюдения"></canvas>
  <div class="pd-shortcuts" aria-label="Горячие клавиши">
    <span class="pd-shortcuts-title">Управление</span>
    <span class="pd-shortcut"><kbd>Пробел</kbd><kbd>↑</kbd><kbd>W</kbd> Прыжок</span>
    <span class="pd-shortcut"><kbd>↓</kbd><kbd>S</kbd> Пригнуться</span>
    <span class="pd-shortcut"><kbd>R</kbd> Заново</span>
    <span class="pd-shortcut"><kbd>Клик</kbd> Прыжок</span>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('pumpkin-dino-root');
  const canvas = document.getElementById('pd-canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('pd-score');
  const bestEl = document.getElementById('pd-best');
  const multEl = document.getElementById('pd-mult');

  const PAL = {
    sky1: '#ffffff', sky2: '#eef1f6', cloud: '#dfe4ee',
    road: '#16181d', roadLine: '#ffffff', roadEdge: '#e8ebef',
    pole: '#111111', zone: '#d21f2c', zoneOff: '#9aa4b2',
    camBody: '#1f4fd8', camLens: '#111111', camBlink: '#d21f2c',
    pumpkin: '#ff8f2b', pumpkinDark: '#8f0f1c', stem: '#111111',
    city: '#1c2748', window: '#ff8f2b', field: '#3f5aa8', hay: '#ff8f2b',
    forest: '#1c2748', autumn: '#ff8f2b',
    overlay: 'rgba(10,10,14,0.7)'
  };

  let W = 800; const H = 400;
  const resize = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = r.width;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize(); new ResizeObserver(resize).observe(canvas);

  const GROUND = H - 80, PX = 80, G = 2900, JUMP = -1120, PR = 15;
  // Скорость продолжает расти без жёсткого потолка, в том числе после ×30.
  const SPEED_BASE = 360, SPEED_POW = 0.3;
  const BIOME_LEN = 60000; // город -> поля -> лес -> по кругу
  const BIOMES = ['city', 'field', 'forest'];
  const readBest = () => { try { return +(localStorage.getItem('pumpkin-dino-best') || 0); } catch (_) { return 0; } };
  const saveBest = (value) => { try { localStorage.setItem('pumpkin-dino-best', String(value)); } catch (_) {} };
  let state, best = readBest();
  bestEl.textContent = best.toLocaleString('ru-RU');

  const reset = () => {
    state = { y: GROUND, vy: 0, ducking: false, alive: true, started: false,
      speed: 360, score: 0, dist: 0, t: 0,
      poles: [], clouds: [], dashes: [], nextPole: 800, nextCloud: 200, won: false,
      // концовка: ending — тыква едет к ферме, won — докатилась
      ending: false, phase: '', endT: 0, farX: 0, px: PX, roll: 0, multEnd: null };
    hud();
  };
  const hud = () => {
    scoreEl.textContent = Math.floor(state.score).toLocaleString('ru-RU');
    bestEl.textContent = best.toLocaleString('ru-RU');
    const m = state.started ? mult() : 1;
    multEl.textContent = '×' + (m >= 1000 ? Math.round(m).toLocaleString('ru-RU') : m.toFixed(1));
  };

  const jump = () => {
    if (!state.alive || state.ending) return;
    if (!state.started) state.started = true;
    if (state.y >= GROUND) { state.vy = JUMP; state.ducking = false; }
  };

  const mult = () => state.multEnd !== null ? state.multEnd : Math.exp(state.dist * 0.000025);
  const speedFor = () => SPEED_BASE * Math.pow(mult(), SPEED_POW);
  const WIN_SCORE = 100000000;
  const NEW_CAMERA_SCORE = 50000000;
  const DAY_CYCLE_SCORE = 100000;
  const DAY_PALETTES = [
    { sky1: '#f6d9a8', sky2: '#f3a76e', cloud: '#fff0d2' }, // рассвет
    { sky1: '#83c9f2', sky2: '#d7efff', cloud: '#ffffff' }, // день
    { sky1: '#e58a68', sky2: '#554b78', cloud: '#f2b6a0' }, // закат
    { sky1: '#101b3a', sky2: '#27385e', cloud: '#71809f' }  // ночь
  ];
  const dayPalette = () => DAY_PALETTES[Math.floor(state.score / DAY_CYCLE_SCORE) % DAY_PALETTES.length];

  const spawnPole = () => {
    if (state.dist + 80 < state.nextPole) return;
    const spawnX = state.nextPole;
    const difficulty = Math.min(0.38, state.score / 180000000);
    const minGap = state.speed * 1.18 + 190;
    const gap = (820 + Math.random() * 420) * (1 - difficulty);
    state.nextPole = spawnX + Math.max(minGap, gap);
    const lidarUnlocked = state.score >= NEW_CAMERA_SCORE;
    const type = lidarUnlocked && Math.random() < 0.36 ? 'lidar' : 'beam';
    const sky = type === 'beam' && Math.random() < 0.4;
    state.poles.push({
      x: spawnX,
      type,
      h: type === 'lidar' ? 54 : 76 + Math.random() * 24,
      sky,
      // в canvas y растёт вниз: наземные лучи — положительный угол (вниз к дороге),
      // небесные — отрицательный (вверх). Крутые углы, чтобы наземную зону всегда
      // можно было перепрыгнуть одним прыжком
      angle: sky ? -(30 + Math.random() * 30) * Math.PI / 180
                 : (28 + Math.random() * 12) * Math.PI / 180,
      period: 2.2
    });
  };

  // геометрия луча: треугольник постоянного размера, движется вместе со столбом.
  // Вершина — в объективе камеры (на конце кронштейна), а не на столбе
  const beamGeom = (p) => {
    const cx = p.x + 17, cy = GROUND - p.h - 6;
    // наземный: вдвое длиннее высоты столба по вертикали (уходит под дорогу);
    // небесный: фиксированная удлинённая длина
    const len = p.sky ? 420 : ((GROUND - cy) / Math.sin(p.angle)) * 2;
    const x2 = cx + Math.cos(p.angle) * len, y2 = cy + Math.sin(p.angle) * len;
    // ширина сужается со счётом, но не ниже предела — зона всегда видна
    // и перепрыгивается (шанс на прохождение сохраняется)
    const half = p.sky ? Math.max(13, 34 - state.score / 250)
                       : Math.max(11, 26 - state.score / 250);
    const nx = -Math.sin(p.angle) * half, ny = Math.cos(p.angle) * half;
    return { cx, cy, x2, y2, a1x: x2 + nx, a1y: y2 + ny, a2x: x2 - nx, a2y: y2 - ny };
  };

  const inBeam = (p, x, y) => {
    if (p.type === 'lidar') return false;
    const b = beamGeom(p);
    // точка внутри треугольника: знаковый метод
    const sign = (ax, ay, bx, by, qx, qy) => (bx - ax) * (qy - ay) - (by - ay) * (qx - ax);
    const d1 = sign(b.cx, b.cy, b.a1x, b.a1y, x, y);
    const d2 = sign(b.a1x, b.a1y, b.a2x, b.a2y, x, y);
    const d3 = sign(b.a2x, b.a2y, b.cx, b.cy, x, y);
    const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
    return !(neg && pos);
  };

  // лучи горят всегда
  const beamState = () => true;

  // детерминированный псевдорандом по мировому индексу — фон стабильный
  const rnd = (i) => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };

  // биом определяется мировой координатой объекта: старые объекты уезжают,
  // новые въезжают — смена фона идёт «друг за другом», без мгновенной подмены
  const BIOME_BG = BIOME_LEN * 0.35;
  const biomeAt = (wx) => Math.floor(wx / BIOME_BG) % BIOMES.length;

  const drawBiome = (alpha) => {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const px = state.dist * 0.35; // параллакс фона
    // город: панельные дома
    const SP = 210;
    const start = Math.floor(px / SP) - 1, end = start + Math.ceil(W / SP) + 3;
    for (let i = start; i <= end; i++) {
      if (biomeAt(i * SP + px) !== 0) continue;
      const x = i * SP - px, r1 = rnd(i), r2 = rnd(i + 100.7);
      const h = 90 + r1 * 120, w = 120 + r2 * 80;
      ctx.fillStyle = PAL.city;
      ctx.fillRect(x, GROUND - h, w, h);
      ctx.fillStyle = PAL.window;
      for (let wy = GROUND - h + 14; wy < GROUND - 16; wy += 26) {
        for (let wx = x + 10; wx < x + w - 14; wx += 24) {
          if (rnd(wx * 3.1 + wy * 7.7) > 0.55) ctx.fillRect(wx, wy, 9, 12);
        }
      }
    }
    // поля
    // Поля оставлены ровными: декоративные холмы-дуги удалены,
    // чтобы силуэты не выглядели парящими над дорогой.
    // пшеничные ряды: только внутри полей
    ctx.save(); ctx.globalAlpha = alpha;
    for (let row = 0; row < 5; row++) {
      const y = GROUND - 8 - row * 7;
      const depth = 0.4 + row * 0.09;
      ctx.fillStyle = `rgba(255,143,43,${0.5 - row * 0.06})`;
      const step = 30 - row * 3;
      const rpx = state.dist * depth;
      const k0 = Math.floor(rpx / step) - 1, k1 = k0 + Math.ceil(W / step) + 3;
      for (let k = k0; k <= k1; k++) {
        if (biomeAt(k * step + rpx) !== 1) continue;
        ctx.fillRect(k * step - rpx, y, 14 - row, 3);
      }
    }
    ctx.restore();
    // стога сена и пугало
    const SP2 = 340;
    const s0 = Math.floor(px / SP2) - 1, s1 = s0 + Math.ceil(W / SP2) + 3;
    for (let i = s0; i <= s1; i++) {
      if (biomeAt(i * SP2 + px) !== 1) continue;
      const x = i * SP2 - px + 130, r = rnd(i);
      if (r > 0.25) {
        const by = GROUND - 13, br = 12 + r * 7;
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.ellipse(x, GROUND - 2, br + 4, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = PAL.hay;
        ctx.beginPath(); ctx.arc(x, by, br, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
        for (const rr of [br * 0.66, br * 0.33]) {
          ctx.beginPath(); ctx.arc(x, by, rr, 0.4, Math.PI * 1.8); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(x, by, br, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
        ctx.restore();
      }
      if (i % 8 === 1) {
        const sx = i * SP2 - px + 60;
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = PAL.pole;
        ctx.fillRect(sx - 2, GROUND - 52, 4, 52);
        ctx.fillRect(sx - 14, GROUND - 44, 28, 4);
        ctx.fillStyle = PAL.pumpkin;
        ctx.beginPath(); ctx.arc(sx, GROUND - 56, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = PAL.pole;
        ctx.fillRect(sx - 8, GROUND - 66, 16, 4);
        ctx.fillStyle = '#5a3d20';
        ctx.fillRect(sx - 5, GROUND - 69, 10, 3);
        ctx.restore();
      }
    }
    // сплошной забор — сегментами только внутри полей
    ctx.save(); ctx.globalAlpha = alpha;
    const FP = 60;
    const f0 = Math.floor(px / FP) - 1, f1 = f0 + Math.ceil(W / FP) + 3;
    ctx.fillStyle = PAL.pole;
    for (let i = f0; i <= f1; i++) {
      if (biomeAt(i * FP + FP / 2 + px) === 1) ctx.fillRect(i * FP - px, GROUND - 20, 4, 20);
    }
    for (let i = f0; i <= f1; i++) {
      if (biomeAt(i * FP + FP / 2 + px) !== 1) continue;
      ctx.fillRect(i * FP - px, GROUND - 17, FP, 3);
      ctx.fillRect(i * FP - px, GROUND - 9, FP, 3);
    }
    ctx.restore();
    // ЛЕС: единая локация. Он включается только после фактического
    // перехода в лесной биом, а не просачивается отдельными объектами в поле.
    const forestPhase = state.dist % BIOME_BG;
    const forestBiomeActive = biomeAt(state.dist) === 2;
    const smooth01 = (v) => { const t = Math.max(0, Math.min(1, v)); return t * t * (3 - 2 * t); };
    const forestFade = forestBiomeActive
      ? smooth01(Math.min(forestPhase / 900, (BIOME_BG - forestPhase) / 900))
      : 0;
    const forestLayer = (spacing, depth, baseAlpha, offset, drawItem) => {
      if (forestFade <= 0) return;
      const travel = state.dist * depth;
      const first = Math.floor(travel / spacing) - 2;
      const last = first + Math.ceil(W / spacing) + 5;
      for (let i = first; i <= last; i++) {
        const x = i * spacing - travel + offset;
        ctx.save(); ctx.globalAlpha = alpha * forestFade * baseAlpha;
        drawItem(x, rnd(i * 1.37 + offset), i);
        ctx.restore();
      }
    };

    // Низкие холмы/кочки в лесном фоне отключены: линия горизонта чистая.

    // Дальний хвойный массив — более холодный и низкоконтрастный.
    const pine = (x, base, h, color, trunkColor, widthScale = 1) => {
      ctx.fillStyle = trunkColor;
      ctx.fillRect(x - 2.5, base - h * 0.23, 5, h * 0.23);
      ctx.fillStyle = color;
      for (let tier = 0; tier < 4; tier++) {
        const top = base - h * (0.28 + tier * 0.19);
        const half = h * (0.27 - tier * 0.035) * widthScale;
        ctx.beginPath();
        ctx.moveTo(x, top - h * 0.31);
        ctx.lineTo(x + half, top + h * 0.12);
        ctx.quadraticCurveTo(x, top + h * 0.04, x - half, top + h * 0.12);
        ctx.closePath(); ctx.fill();
      }
    };
    forestLayer(74, 0.24, 0.5, 0, (x, r) => {
      pine(x, GROUND - 4, 76 + r * 70, r > 0.5 ? '#526d83' : '#405f78', '#46515b', 0.9);
    });

    // Средний план: крупные ели и берёзы, силуэты перекрывают друг друга.
    forestLayer(128, 0.32, 0.78, 35, (x, r, i) => {
      const h = 125 + r * 95;
      if (r > 0.76) {
        ctx.fillStyle = '#574638';
        ctx.fillRect(x - 5, GROUND - h * 0.78, 10, h * 0.78);
        ctx.fillStyle = '#d8d2bd';
        ctx.fillRect(x - 4, GROUND - h * 0.78, 7, h * 0.78);
        ctx.fillStyle = '#5c5549';
        for (let k = 0; k < 5; k++) ctx.fillRect(x - 4, GROUND - h * 0.7 + k * h * 0.13, 8, 3);
        ctx.fillStyle = '#426b4c';
        ctx.beginPath(); ctx.arc(x, GROUND - h * 0.86, 31 + r * 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x - 20, GROUND - h * 0.78, 23, 0, Math.PI * 2); ctx.arc(x + 22, GROUND - h * 0.79, 25, 0, Math.PI * 2); ctx.fill();
      } else {
        pine(x, GROUND, h, r > 0.4 ? '#28583f' : '#214a3b', '#493a2b', 1.05);
      }
    });

    // Передний план: широкие лиственные кроны с отдельными пятнами света.
    forestLayer(205, 0.48, 0.95, 80, (x, r, i) => {
      const h = 105 + r * 70;
      const trunkX = x + (r - 0.5) * 14;
      ctx.fillStyle = '#493526';
      ctx.fillRect(trunkX - 6, GROUND - h * 0.73, 12, h * 0.73);
      ctx.fillStyle = '#705039';
      ctx.fillRect(trunkX - 2, GROUND - h * 0.68, 3, h * 0.63);
      const cy = GROUND - h * 0.78;
      const leaf = r > 0.52 ? '#28563a' : '#315f3e';
      ctx.fillStyle = leaf;
      ctx.beginPath();
      ctx.arc(x, cy, 37 + r * 8, 0, Math.PI * 2);
      ctx.arc(x - 27, cy + 13, 27, 0, Math.PI * 2);
      ctx.arc(x + 29, cy + 11, 30, 0, Math.PI * 2);
      ctx.arc(x - 8, cy - 20, 27, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(142,174,91,0.28)';
      ctx.beginPath(); ctx.arc(x - 12, cy - 15, 17, 0, Math.PI * 2); ctx.arc(x + 20, cy + 1, 12, 0, Math.PI * 2); ctx.fill();
      // Несколько тонких ветвей и свисающая лиана.
      ctx.strokeStyle = '#493526'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(trunkX, GROUND - h * 0.5); ctx.lineTo(x - 25, cy + 10); ctx.moveTo(trunkX, GROUND - h * 0.57); ctx.lineTo(x + 26, cy + 8); ctx.stroke();
      if (i % 3 === 0) {
        ctx.strokeStyle = '#456c43'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x + 20, cy + 12); ctx.quadraticCurveTo(x + 34, cy + 42, x + 25, cy + 61); ctx.stroke();
      }
      // Редкая пасхалка: почти незаметная гравировка S.I.T на коре.
      // Большой шаг между индексами не даёт надписи повторяться часто.
      if (i % 29 === 11) {
        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.translate(trunkX + 1, GROUND - h * 0.34);
        ctx.rotate(-0.045);
        ctx.fillStyle = '#b39a73';
        ctx.font = '600 7px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('S.I.T', 0, 0);
        ctx.restore();
      }
    });

    // Кустарник, папоротники, валежник и небольшие детали лесной подстилки.
    forestLayer(58, 0.66, 0.92, 18, (x, r, i) => {
      const y = GROUND - 7;
      ctx.fillStyle = r > 0.5 ? '#315d3d' : '#244d37';
      ctx.beginPath();
      ctx.arc(x, y - 12, 15 + r * 5, Math.PI, 0);
      ctx.arc(x + 13, y - 8, 12, Math.PI, 0);
      ctx.arc(x - 13, y - 7, 11, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = '#6c8c50'; ctx.lineWidth = 2;
      for (let f = -2; f <= 2; f++) {
        ctx.beginPath(); ctx.moveTo(x + f * 5, y); ctx.quadraticCurveTo(x + f * 10, y - 15, x + f * 12, y - 22 - r * 5); ctx.stroke();
      }
      if (i % 5 === 0) {
        ctx.fillStyle = '#806044'; ctx.save(); ctx.translate(x + 24, y - 3); ctx.rotate(-0.12); ctx.fillRect(-19, -4, 38, 8); ctx.restore();
        ctx.fillStyle = '#d9c8a0'; ctx.beginPath(); ctx.arc(x + 4, y - 17, 3, 0, Math.PI * 2); ctx.arc(x + 32, y - 13, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      if (i % 7 === 2) {
        ctx.fillStyle = '#d7b7a0'; ctx.fillRect(x - 2, y - 8, 4, 8);
        ctx.fillStyle = '#c65a4c'; ctx.beginPath(); ctx.arc(x, y - 9, 7, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#f4e5cf'; ctx.beginPath(); ctx.arc(x - 2, y - 13, 1.3, 0, Math.PI * 2); ctx.arc(x + 3, y - 12, 1.3, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Пятна света между кронами и редкие светлячки — добавляют глубину, не отвлекая от игры.
    forestLayer(245, 0.38, 0.5, 120, (x, r, i) => {
      if (r > 0.55) {
        const glow = 0.12 + 0.08 * Math.sin(state.t * 2 + i);
        ctx.fillStyle = `rgba(232,241,190,${glow})`;
        ctx.beginPath(); ctx.ellipse(x, GROUND - 115 - r * 50, 22 + r * 12, 58, 0, 0, Math.PI * 2); ctx.fill();
      }
    });
    forestLayer(170, 0.72, 0.85, 55, (x, r, i) => {
      if (r > 0.83) {
        const blink = 0.45 + 0.45 * Math.sin(state.t * 4 + i);
        ctx.fillStyle = `rgba(222,244,143,${blink})`;
        ctx.beginPath(); ctx.arc(x, GROUND - 68 - r * 35, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();
  };

  const physics = (dt) => {
    if (!(state.ducking && state.y >= GROUND)) state.vy += G * dt;
    state.y += state.vy * dt;
    if (state.y >= GROUND) { state.y = GROUND; state.vy = 0; }
  };

  // ── КОНЦОВКА ─────────────────────────────────────────────────────────
  const startEnding = () => {
    state.multEnd = Math.exp(state.dist * 0.000025); // множитель замирает на финише
    state.score = WIN_SCORE;
    state.ending = true; state.phase = 'approach'; state.endT = 0;
    state.farX = W + 600;                             // ворота фермы выезжают справа
    state.poles = state.poles.filter(p => p.x < W);   // новые столбы уже не появятся
    best = Math.max(best, WIN_SCORE);
    saveBest(best);
    hud();
  };

  const stepEnding = (dt) => {
    physics(dt);
    const stopX = W * 0.38;
    if (state.phase === 'approach') {
      // мир плавно тормозит и останавливается, когда ворота доезжают до stopX
      const left = state.farX - stopX;
      state.speed = left <= 0.5 ? 0 : Math.min(state.speed, Math.max(40, left * 1.6));
      const mv = Math.min(state.speed * dt, Math.max(0, left));
      state.dist += mv; state.farX -= mv;
      for (const p of state.poles) p.x -= mv;
      state.poles = state.poles.filter(p => p.x > -80);
      state.clouds = state.clouds.filter(c => (c.x -= mv * 0.25) > -80);
      if (state.farX - stopX <= 0.5) { state.phase = 'roll'; state.speed = 0; }
    } else if (state.phase === 'roll') {
      // мир стоит — тыква сама катится через ворота вглубь фермы
      const target = state.farX + 120;
      const left = target - state.px;
      const mv = Math.min(left, Math.max(30, Math.min(240, left * 1.6)) * dt);
      state.px += mv; state.roll += mv;
      if (left - mv < 0.5) { state.px = target; state.won = true; state.endT = 0; }
    }
  };

  const step = (dt) => {
    if (!state.alive || !state.started) return;
    state.t += dt;
    if (state.won) return;
    if (state.ending) { stepEnding(dt); return; }
    state.speed = speedFor();
    state.dist += state.speed * dt;
    state.score = state.dist / 12 * mult();
    if (state.score >= WIN_SCORE) { startEnding(); return; }

    physics(dt);

    if (state.dist > state.nextCloud) {
      state.clouds.push({ x: W + 60, y: 30 + Math.random() * 110 });
      state.nextCloud = state.dist + 300 + Math.random() * 400;
    }
    state.clouds = state.clouds.filter(c => (c.x -= state.speed * 0.25 * dt) > -80);

    spawnPole();
    const px = PX, py = state.y;
    for (const p of state.poles) {
      const previousX = p.x;
      p.x -= state.speed * dt;
      if (state.alive) {
        const travel = previousX - p.x;
        const samples = Math.min(128, Math.max(1, Math.ceil(travel / 8)));
        const crouched = state.ducking && state.y >= GROUND - 1;
        const bodyY = py - (crouched ? 8 : PR);
        const bodyHalfH = crouched ? 7 : 14;
        for (let j = 0; j <= samples && state.alive; j++) {
          const sampleX = previousX - travel * (j / samples);
          if (p.type === 'lidar') {
            const beamLeft = sampleX - 46, beamRight = sampleX + 112;
            const beamTop = GROUND - 32, beamBottom = GROUND - 20;
            const pumpkinLeft = px - (crouched ? 19 : PR);
            const pumpkinRight = px + (crouched ? 19 : PR);
            if (pumpkinRight >= beamLeft && pumpkinLeft <= beamRight &&
                bodyY + bodyHalfH >= beamTop && bodyY - bodyHalfH <= beamBottom) {
              state.alive = false;
            }
          } else {
            const testPole = { ...p, x: sampleX };
            const radius = crouched ? 9 : PR;
            for (const [ox, oy] of [[0, 0], [radius, 0], [-radius, 0], [0, -radius], [0, radius]]) {
              if (inBeam(testPole, px + ox, py + oy)) { state.alive = false; break; }
            }
          }
        }
      }
    }
    if (!state.alive) {
      best = Math.max(best, Math.floor(state.score));
      saveBest(best);
    }
    state.poles = state.poles.filter(p => p.x > -80);
    hud();
  };

  const drawPumpkin = () => {
    const squashed = state.ducking && state.y >= GROUND;
    const cx = state.px, cy = state.y - (squashed ? 8 : PR);
    ctx.save(); ctx.translate(cx, cy);
    ctx.rotate((state.dist + state.roll) / 22); // тыква катится
    ctx.fillStyle = PAL.pumpkin;
    ctx.beginPath(); ctx.ellipse(0, 0, squashed ? 19 : 15, squashed ? 7 : 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.pumpkinDark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 8, squashed ? 7 : 14, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, squashed ? -10 : -14); ctx.lineTo(0, squashed ? -16 : -19);
    ctx.lineWidth = 4; ctx.strokeStyle = PAL.stem; ctx.stroke();
    ctx.restore();
  };

  // ── ФЕРМА ТЫКВ ───────────────────────────────────────────────────────
  const miniPumpkin = (x, y, r, lift) => {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(x, y + r, r, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    const yy = y - (lift || 0);
    ctx.fillStyle = PAL.pumpkin;
    ctx.beginPath(); ctx.ellipse(x, yy, r * 1.1, r, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.pumpkinDark; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, yy, r * 0.5, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = PAL.stem; ctx.fillRect(x - 1.5, yy - r - 4, 3, 5);
  };
  // когда тыква докатилась, тыквы фермы радостно подпрыгивают
  const cheer = (i) => state.won ? Math.max(0, Math.sin(state.t * 6 + i * 0.9)) * 9 : 0;

  // за дорогой: забор, амбар, пугало, тыквы на грядке
  const drawFarmBack = () => {
    if (!state.ending) return;
    const fx = state.farX;
    if (fx > W + 400) return;
    ctx.fillStyle = PAL.pole;
    for (let x = fx + 70; x < W + 60; x += 40) ctx.fillRect(x, GROUND - 22, 4, 22);
    ctx.fillRect(fx + 70, GROUND - 18, W, 3);
    ctx.fillRect(fx + 70, GROUND - 10, W, 3);
    // амбар
    const bx = fx + 230, bw = 150, bh = 96;
    ctx.fillStyle = PAL.pumpkinDark; ctx.fillRect(bx, GROUND - bh, bw, bh);
    ctx.fillStyle = PAL.pole;
    ctx.beginPath();
    ctx.moveTo(bx - 10, GROUND - bh); ctx.lineTo(bx + bw / 2, GROUND - bh - 46);
    ctx.lineTo(bx + bw + 10, GROUND - bh); ctx.closePath(); ctx.fill();
    const dw = 54, dh = 62, dx = bx + bw / 2 - dw / 2;
    ctx.fillStyle = '#6e0b16'; ctx.fillRect(dx, GROUND - dh, dw, dh);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.strokeRect(dx, GROUND - dh, dw, dh);
    ctx.beginPath();
    ctx.moveTo(dx, GROUND - dh); ctx.lineTo(dx + dw, GROUND);
    ctx.moveTo(dx + dw, GROUND - dh); ctx.lineTo(dx, GROUND); ctx.stroke();
    ctx.fillStyle = PAL.window; ctx.fillRect(bx + bw / 2 - 8, GROUND - bh + 8, 16, 14);
    ctx.lineWidth = 2; ctx.strokeRect(bx + bw / 2 - 8, GROUND - bh + 8, 16, 14);
    // пугало
    const sx = fx + 190;
    ctx.fillStyle = PAL.pole;
    ctx.fillRect(sx - 2, GROUND - 52, 4, 52);
    ctx.fillRect(sx - 14, GROUND - 44, 28, 4);
    ctx.fillStyle = PAL.pumpkin;
    ctx.beginPath(); ctx.arc(sx, GROUND - 56, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.pole;
    ctx.fillRect(sx - 8, GROUND - 66, 16, 4);
    // тыквы вдоль линии земли
    for (let i = 0; i < 30; i++) {
      const x = fx + 150 + i * 34, r = 9 + rnd(i + 5.3) * 4;
      if (x > W + 30) break;
      miniPumpkin(x, GROUND - r, r, cheer(i));
    }
  };

  // перед дорогой: грядки вместо асфальта и ворота с вывеской
  const drawFarmFront = () => {
    if (!state.ending) return;
    const fx = state.farX;
    if (fx > W + 120) return;
    ctx.fillStyle = '#3a2b1d';
    ctx.fillRect(fx + 70, GROUND, W, H - GROUND);
    for (let r = 0; r < 3; r++) {
      for (let i = 0; i < 24; i++) {
        const x = fx + 110 + i * 46 + (r % 2) * 23;
        if (x > W + 30) break;
        miniPumpkin(x, GROUND + 18 + r * 22, 8 + rnd(i * 3 + r + 0.5) * 3, cheer(i + r * 2));
      }
    }
    // ворота
    ctx.fillStyle = PAL.pole;
    ctx.fillRect(fx - 74, GROUND - 150, 8, 150);
    ctx.fillRect(fx + 66, GROUND - 150, 8, 150);
    ctx.fillStyle = PAL.city;
    ctx.beginPath(); ctx.roundRect(fx - 100, GROUND - 158, 200, 36, 5); ctx.fill();
    ctx.strokeStyle = PAL.pumpkin; ctx.lineWidth = 2; ctx.stroke();
    miniPumpkin(fx - 84, GROUND - 140, 6, 0);
    miniPumpkin(fx + 84, GROUND - 140, 6, 0);
    ctx.fillStyle = '#ffffff';
    ctx.font = '500 14px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ТЫКВЕННАЯ ФЕРМА', fx, GROUND - 134);
  };

  const draw = () => {
    const day = dayPalette();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, day.sky1); g.addColorStop(1, day.sky2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = day.cloud;
    for (const c of state.clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 26, 0, Math.PI * 2);
      ctx.arc(c.x + 30, c.y + 7, 20, 0, Math.PI * 2);
      ctx.arc(c.x - 30, c.y + 9, 19, 0, Math.PI * 2);
      ctx.arc(c.x + 4, c.y - 10, 16, 0, Math.PI * 2);
      ctx.fill();
    }
    // фон: биомы сменяются резко, без переливов
    const bgp = state.dist / BIOME_LEN;
    const i0 = Math.floor(bgp) % BIOMES.length;
    drawBiome(1);
    drawFarmBack();

    // дорога
    ctx.fillStyle = PAL.road; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = PAL.roadEdge; ctx.fillRect(0, GROUND, W, 4); ctx.fillRect(0, H - 14, W, 4);
    ctx.fillStyle = PAL.roadLine;
    for (let i = 0; i < W / 90 + 2; i++) {
      const dx = i * 90 - (state.dist % 90);
      ctx.fillRect(dx, GROUND + (H - GROUND) / 2 - 2, 44, 4);
    }
    drawFarmFront();
    // столбы с камерами и зоны наблюдения
    for (const p of state.poles) {
      const camY = GROUND - p.h;
      const active = beamState(p);
      if (p.type === 'lidar') {
        const left = p.x - 46, right = p.x + 112;
        const pulseLidar = 0.72 + 0.28 * Math.sin(state.t * 8 + p.x * 0.02);
        ctx.fillStyle = `rgba(28,220,210,${0.12 * pulseLidar})`;
        ctx.fillRect(left, GROUND - 32, right - left, 12);
        ctx.strokeStyle = `rgba(28,220,210,${0.9 * pulseLidar})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(left, GROUND - 26); ctx.lineTo(right, GROUND - 26); ctx.stroke();
        ctx.fillStyle = '#243746'; ctx.fillRect(p.x - 5, GROUND - p.h, 10, p.h);
        ctx.fillStyle = '#1caaa8';
        ctx.beginPath(); ctx.roundRect(p.x - 13, camY - 10, 30, 18, 4); ctx.fill();
        ctx.fillStyle = '#bafff7'; ctx.beginPath(); ctx.arc(p.x + 11, camY - 1, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d5ffff'; ctx.font = '600 9px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('LIDAR', p.x + 2, camY - 15);
        continue;
      }
      const b = beamGeom(p);
      // зона наблюдения: треугольник от камеры, с градиентом и пульсом
      const pulse = 0.82 + 0.18 * Math.sin(state.t * 6 + p.x * 0.01);
      const grad = ctx.createLinearGradient(b.cx, b.cy, b.x2, b.y2);
      grad.addColorStop(0, `rgba(210,31,44,${0.38 * pulse})`);
      grad.addColorStop(0.55, `rgba(210,31,44,${0.16 * pulse})`);
      grad.addColorStop(1, 'rgba(210,31,44,0.04)');
      ctx.beginPath();
      ctx.moveTo(b.cx, b.cy);
      ctx.lineTo(b.a1x, b.a1y);
      ctx.lineTo(b.a2x, b.a2y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = `rgba(210,31,44,${0.55 * pulse})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // реалистичный столб: тумба с болтами, конусная стойка, изогнутый кронштейн
      const g2 = ctx.createLinearGradient(p.x - 6, 0, p.x + 6, 0);
      g2.addColorStop(0, '#3a4148'); g2.addColorStop(0.5, PAL.pole); g2.addColorStop(1, '#3a4148');
      // тумба
      ctx.fillStyle = PAL.pole;
      ctx.beginPath();
      ctx.moveTo(p.x - 11, GROUND);
      ctx.lineTo(p.x - 7, GROUND - 16);
      ctx.lineTo(p.x + 7, GROUND - 16);
      ctx.lineTo(p.x + 11, GROUND);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5a636c'; // болты
      ctx.fillRect(p.x - 8, GROUND - 4, 3, 3); ctx.fillRect(p.x + 5, GROUND - 4, 3, 3);
      // конусная стойка
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(p.x - 6, GROUND - 16);
      ctx.lineTo(p.x - 2.6, camY);
      ctx.lineTo(p.x + 2.6, camY);
      ctx.lineTo(p.x + 6, GROUND - 16);
      ctx.closePath(); ctx.fill();
      // распределительная коробка
      ctx.fillStyle = PAL.pole;
      ctx.beginPath(); ctx.roundRect(p.x - 5, GROUND - 40, 10, 14, 2); ctx.fill();
      ctx.strokeStyle = '#3a4148'; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - 5, GROUND - 40, 10, 14);
      // изогнутый кронштейн, камера свисает с его конца
      ctx.strokeStyle = PAL.pole; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, camY + 4);
      ctx.quadraticCurveTo(p.x + 2, camY - 12, p.x + 17, camY - 8);
      ctx.stroke();
      // камера на конце кронштейна, направлена по лучу
      ctx.save();
      ctx.translate(p.x + 17, camY - 6);
      ctx.rotate(p.angle);
      ctx.fillStyle = PAL.camBody;
      ctx.beginPath(); ctx.roundRect(-10, -7, 22, 14, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; // блик на корпусе
      ctx.beginPath(); ctx.roundRect(-8, -6, 18, 4, 2); ctx.fill();
      ctx.fillStyle = PAL.camLens;
      ctx.beginPath(); ctx.arc(10, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; // блик на линзе
      ctx.beginPath(); ctx.arc(11, -1.2, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.camLens;
      ctx.fillRect(-13, -3, 4, 6); // крепление сзади
      ctx.fillStyle = active ? PAL.camBlink : 'rgba(0,0,0,0.25)';
      if (active) {
        // свечение сигнального огонька
        ctx.save(); ctx.globalAlpha = 0.3 + 0.15 * Math.sin(state.t * 6);
        ctx.beginPath(); ctx.arc(-5, -3, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(-5, -3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawPumpkin();

    ctx.textAlign = 'center';
    if (state.won) {
      // конфетти поверх фермы
      for (let i = 0; i < 40; i++) {
        const x = (i * 173 + Math.sin(state.t * 2 + i) * 30) % W;
        const y = (i * 97 + state.t * 60 + i * i * 7) % H;
        ctx.fillStyle = i % 3 === 0 ? PAL.pumpkin : (i % 3 === 1 ? PAL.camBody : '#ffffff');
        ctx.beginPath(); ctx.arc(x, y, 3 + (i % 3), 0, Math.PI * 2); ctx.fill();
      }
      const pw = Math.min(W - 24, 400), ph = 104;
      ctx.fillStyle = 'rgba(15,15,30,0.82)';
      ctx.beginPath(); ctx.roundRect(W / 2 - pw / 2, 24, pw, ph, 10); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '500 26px system-ui, sans-serif';
      ctx.fillText('100 000 000!', W / 2, 24 + 36);
      ctx.font = '400 15px system-ui, sans-serif';
      ctx.fillText('Тыква обошла все камеры и докатилась до фермы!', W / 2, 24 + 64);
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.fillStyle = PAL.zoneOff;
      ctx.fillText('клик — сыграть ещё раз', W / 2, 24 + 88);
    } else if (!state.alive) {
      ctx.fillStyle = PAL.overlay; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.font = '500 22px system-ui, sans-serif';
      ctx.fillText('G A M E   O V E R', W / 2, H / 2 - 12);
      ctx.font = '400 14px system-ui, sans-serif';
      ctx.fillText('Счёт: ' + Math.floor(state.score).toLocaleString('ru-RU') + ' · Рекорд: ' + best.toLocaleString('ru-RU') + ' · клик — заново', W / 2, H / 2 + 16);
    } else if (!state.started) {
      ctx.fillStyle = '#2b5e7d';
      ctx.font = '400 14px system-ui, sans-serif';
      ctx.fillText('Пробел / клик — прыжок   ·   ↓ / S — пригнуться', W / 2, H / 2 - 30);
    }
  };

  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  };
  reset(); requestAnimationFrame(loop);

  const restart = () => { reset(); };
  root.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    if (!state.alive || state.won) restart(); else if (!state.ending) jump();
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea,select,button')) return;
    if (e.code === 'KeyR') { e.preventDefault(); restart(); return; }
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (!state.alive || state.won) restart(); else if (!state.ending) jump();
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (state.alive && !state.ending && state.y >= GROUND - 1) state.ducking = true; }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') state.ducking = false;
  });
  window.addEventListener('blur', () => { state.ducking = false; });
  document.getElementById('pd-restart').addEventListener('click', restart);
})();
</script>

</div>
</body>
</html>
