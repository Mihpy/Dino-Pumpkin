<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тыква-динозаврик</title>
<style>
:root { color-scheme: light dark; }
body { margin:0; padding:16px; font: 400 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; background:#f6f7f9; color:#1c2430; display:flex; justify-content:center; }
#stage { width:100%; max-width:900px; }
.viz-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.viz-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.btn { border:1px solid #c6ccd4; background:#fff; color:#1c2430; border-radius:8px; padding:4px 12px; font:inherit; cursor:pointer; }
.btn:hover { background:#eef1f5; }
.text-muted { color:#5a6472; }
.text-small { font-size:12px; }
.tabular-nums { font-variant-numeric: tabular-nums; }
strong { font-weight:500; }
@media (prefers-color-scheme: dark) {
  body { background:#12161c; color:#e8ebef; }
  .btn { background:#1c222b; border-color:#39414d; color:#e8ebef; }
  .btn:hover { background:#262d38; }
  .text-muted { color:#9aa4b2; }
}
</style>
</head>
<body>
<div id="stage">
<div id="pumpkin-dino-root"><div id="pumpkin-dino-root">
  <div class="viz-controls" style="justify-content:space-between;align-items:center">
    <div class="viz-row" style="gap:16px">
      <span>Счёт <strong class="tabular-nums" id="pd-score" style="color:#ff8f2b">0</strong></span>
      <span class="text-muted">Рекорд <span class="tabular-nums" id="pd-best">0</span></span>
      <span style="color:#1f4fd8">Множитель <strong class="tabular-nums" id="pd-mult">×1.0</strong></span>
    </div>
    <button type="button" class="btn btn-sm" id="pd-restart">Заново</button>
  </div>
  <canvas id="pd-canvas" style="width:100%;height:400px;display:block;border-radius:var(--radius-lg);touch-action:none" role="img" aria-label="Игра: тыква катится по дороге через город, поля и лес, прыгай через столбы с камерами и не попадай в зоны наблюдения"></canvas>
</div>
<script>
(() => {
  const root = document.getElementById('pumpkin-dino-root');
  const canvas = document.getElementById('pd-canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('pd-score');
  const bestEl = document.getElementById('pd-best');
  const multEl = document.getElementById('pd-mult');

  const PAL = {
    sky1: '#ffffff', sky2: '#eef1f6', cloud: '#dfe4ee',
    road: '#16181d', roadLine: '#ffffff', roadEdge: '#e8ebef',
    pole: '#111111', zone: '#d21f2c', zoneOff: '#9aa4b2',
    camBody: '#1f4fd8', camLens: '#111111', camBlink: '#d21f2c',
    pumpkin: '#ff8f2b', pumpkinDark: '#8f0f1c', stem: '#111111',
    city: '#1c2748', window: '#ff8f2b', field: '#3f5aa8', hay: '#ff8f2b',
    forest: '#1c2748', autumn: '#ff8f2b',
    overlay: 'rgba(10,10,14,0.7)'
  };

  let W = 800; const H = 400;
  const resize = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = r.width;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize(); new ResizeObserver(resize).observe(canvas);

  const GROUND = H - 80, PX = 80, G = 2900, JUMP = -1120, PR = 15;
  const BIOME_LEN = 60000; // город -> поля -> лес -> по кругу
  const BIOMES = ['city', 'field', 'forest'];
  let state, best = +(localStorage.getItem('pumpkin-dino-best') || 0);
  bestEl.textContent = best.toLocaleString('ru-RU');

  const reset = () => {
    state = { y: GROUND, vy: 0, ducking: false, alive: true, started: false,
      speed: 360, score: 0, dist: 0, t: 0,
      poles: [], clouds: [], dashes: [], nextPole: 800, nextCloud: 200, won: false };
    hud();
  };
  const hud = () => {
    scoreEl.textContent = Math.floor(state.score).toLocaleString('ru-RU');
    bestEl.textContent = best.toLocaleString('ru-RU');
    multEl.textContent = '×' + (state.started ? mult().toFixed(1) : '1.0');
  };

  const jump = () => {
    if (!state.alive) return;
    if (!state.started) state.started = true;
    if (state.y >= GROUND) { state.vy = JUMP; state.ducking = false; }
  };

  const mult = () => Math.exp(state.dist * 0.000025);
  const WIN_SCORE = 1e9;

  const spawnPole = () => {
    if (state.dist + 80 < state.nextPole) return;
    const minGap = state.speed * 0.95 + 140;
    const gap = (620 + Math.random() * 380) * Math.max(0.7, 1 - state.score / 2000);
    state.nextPole += Math.max(minGap, gap);
    const sky = Math.random() < 0.4; // камера смотрит в небо — зона висит в воздухе
    state.poles.push({
      x: state.nextPole,
      h: 76 + Math.random() * 24,
      sky,
      // в canvas y растёт вниз: наземные лучи — положительный угол (вниз к дороге),
      // небесные — отрицательный (вверх). Крутые углы, чтобы наземную зону всегда
      // можно было перепрыгнуть одним прыжком
      angle: sky ? -(30 + Math.random() * 30) * Math.PI / 180
                 : (28 + Math.random() * 12) * Math.PI / 180,
      period: 2.2
    });
  };

  // геометрия луча: треугольник постоянного размера, движется вместе со столбом.
  // Вершина — в объективе камеры (на конце кронштейна), а не на столбе
  const beamGeom = (p) => {
    const cx = p.x + 17, cy = GROUND - p.h - 6;
    // наземный: вдвое длиннее высоты столба по вертикали (уходит под дорогу);
    // небесный: фиксированная удлинённая длина
    const len = p.sky ? 420 : ((GROUND - cy) / Math.sin(p.angle)) * 2;
    const x2 = cx + Math.cos(p.angle) * len, y2 = cy + Math.sin(p.angle) * len;
    // ширина сужается со счётом, но не ниже предела — зона всегда видна
    // и перепрыгивается (шанс на прохождение сохраняется)
    const half = p.sky ? Math.max(13, 34 - state.score / 250)
                       : Math.max(11, 26 - state.score / 250);
    const nx = -Math.sin(p.angle) * half, ny = Math.cos(p.angle) * half;
    return { cx, cy, x2, y2, a1x: x2 + nx, a1y: y2 + ny, a2x: x2 - nx, a2y: y2 - ny };
  };

  const inBeam = (p, x, y) => {
    const b = beamGeom(p);
    // точка внутри треугольника: знаковый метод
    const sign = (ax, ay, bx, by, qx, qy) => (bx - ax) * (qy - ay) - (by - ay) * (qx - ax);
    const d1 = sign(b.cx, b.cy, b.a1x, b.a1y, x, y);
    const d2 = sign(b.a1x, b.a1y, b.a2x, b.a2y, x, y);
    const d3 = sign(b.a2x, b.a2y, b.cx, b.cy, x, y);
    const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
    return !(neg && pos);
  };

  // лучи горят всегда
  const beamState = () => true;

  // детерминированный псевдорандом по мировому индексу — фон стабильный
  const rnd = (i) => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };

  // биом определяется мировой координатой объекта: старые объекты уезжают,
  // новые въезжают — смена фона идёт «друг за другом», без мгновенной подмены
  const BIOME_BG = BIOME_LEN * 0.35;
  const biomeAt = (wx) => Math.floor(wx / BIOME_BG) % BIOMES.length;

  const drawBiome = (alpha) => {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const px = state.dist * 0.35; // параллакс фона
    // город: панельные дома
    const SP = 210;
    const start = Math.floor(px / SP) - 1, end = start + Math.ceil(W / SP) + 3;
    for (let i = start; i <= end; i++) {
      if (biomeAt(i * SP) !== 0) continue;
      const x = i * SP - px, r1 = rnd(i), r2 = rnd(i + 100.7);
      const h = 90 + r1 * 120, w = 120 + r2 * 80;
      ctx.fillStyle = PAL.city;
      ctx.fillRect(x, GROUND - h, w, h);
      ctx.fillStyle = PAL.window;
      for (let wy = GROUND - h + 14; wy < GROUND - 16; wy += 26) {
        for (let wx = x + 10; wx < x + w - 14; wx += 24) {
          if (rnd(wx * 3.1 + wy * 7.7) > 0.55) ctx.fillRect(wx, wy, 9, 12);
        }
      }
    }
    // поля
    // дальние холмы (дымка)
    const SP0 = 420;
    const h0 = Math.floor(px / SP0) - 1, h1 = h0 + Math.ceil(W / SP0) + 3;
    for (let i = h0; i <= h1; i++) {
      if (biomeAt(i * SP0 + 200) !== 1) continue;
      const x = i * SP0 - px, r = rnd(i);
      ctx.save(); ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = '#b9c8e8';
      ctx.beginPath(); ctx.arc(x, GROUND, 150 + r * 80, Math.PI, 0); ctx.fill();
      ctx.restore();
    }
    // ближние холмы
    for (let i = h0; i <= h1; i++) {
      if (biomeAt(i * SP0 + 200) !== 1) continue;
      const x = i * SP0 - px + 200, r = rnd(i + 31.7);
      ctx.save(); ctx.globalAlpha = alpha * 0.8;
      ctx.fillStyle = '#8fa6d4';
      ctx.beginPath(); ctx.arc(x, GROUND, 100 + r * 60, Math.PI, 0); ctx.fill();
      ctx.restore();
    }
    // пшеничные ряды: только внутри полей
    ctx.save(); ctx.globalAlpha = alpha;
    for (let row = 0; row < 5; row++) {
      const y = GROUND - 8 - row * 7;
      const depth = 0.4 + row * 0.09;
      ctx.fillStyle = `rgba(255,143,43,${0.5 - row * 0.06})`;
      const step = 30 - row * 3;
      const rpx = state.dist * depth;
      const k0 = Math.floor(rpx / step) - 1, k1 = k0 + Math.ceil(W / step) + 3;
      for (let k = k0; k <= k1; k++) {
        if (biomeAt(k * step) !== 1) continue;
        ctx.fillRect(k * step - rpx, y, 14 - row, 3);
      }
    }
    ctx.restore();
    // стога сена и пугало
    const SP2 = 340;
    const s0 = Math.floor(px / SP2) - 1, s1 = s0 + Math.ceil(W / SP2) + 3;
    for (let i = s0; i <= s1; i++) {
      if (biomeAt(i * SP2) !== 1) continue;
      const x = i * SP2 - px + 130, r = rnd(i);
      if (r > 0.25) {
        const by = GROUND - 13, br = 12 + r * 7;
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.ellipse(x, GROUND - 2, br + 4, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = PAL.hay;
        ctx.beginPath(); ctx.arc(x, by, br, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
        for (const rr of [br * 0.66, br * 0.33]) {
          ctx.beginPath(); ctx.arc(x, by, rr, 0.4, Math.PI * 1.8); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(x, by, br, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
        ctx.restore();
      }
      if (i % 8 === 1) {
        const sx = i * SP2 - px + 60;
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = PAL.pole;
        ctx.fillRect(sx - 2, GROUND - 52, 4, 52);
        ctx.fillRect(sx - 14, GROUND - 44, 28, 4);
        ctx.fillStyle = PAL.pumpkin;
        ctx.beginPath(); ctx.arc(sx, GROUND - 56, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = PAL.pole;
        ctx.fillRect(sx - 8, GROUND - 66, 16, 4);
        ctx.fillStyle = '#5a3d20';
        ctx.fillRect(sx - 5, GROUND - 69, 10, 3);
        ctx.restore();
      }
    }
    // сплошной забор — сегментами только внутри полей
    ctx.save(); ctx.globalAlpha = alpha;
    const FP = 60;
    const f0 = Math.floor(px / FP) - 1, f1 = f0 + Math.ceil(W / FP) + 3;
    ctx.fillStyle = PAL.pole;
    for (let i = f0; i <= f1; i++) {
      if (biomeAt(i * FP + FP / 2) === 1) ctx.fillRect(i * FP - px, GROUND - 20, 4, 20);
    }
    for (let i = f0; i <= f1; i++) {
      if (biomeAt(i * FP + FP / 2) !== 1) continue;
      ctx.fillRect(i * FP - px, GROUND - 17, FP, 3);
      ctx.fillRect(i * FP - px, GROUND - 9, FP, 3);
    }
    ctx.restore();
    // лес: два слоя
    const fir = (x, base, h, trunk, body) => {
      ctx.fillStyle = trunk;
      ctx.fillRect(x - 3, base - h * 0.22, 6, h * 0.22);
      ctx.fillStyle = body;
      for (let tier = 0; tier < 3; tier++) {
        const ty = base - h * (0.18 + tier * 0.27);
        const tw = (h * 0.42) * (1 - tier * 0.26);
        ctx.beginPath();
        ctx.moveTo(x, ty - h * 0.34);
        ctx.lineTo(x + tw, ty);
        ctx.lineTo(x - tw, ty);
        ctx.closePath(); ctx.fill();
      }
    };
    const farPx = state.dist * 0.28;
    const SP3 = 90;
    const t0 = Math.floor(farPx / SP3) - 1, t1 = t0 + Math.ceil(W / SP3) + 3;
    for (let i = t0; i <= t1; i++) {
      if (biomeAt(i * SP3) !== 2) continue;
      const x = i * SP3 - farPx, r = rnd(i);
      ctx.save(); ctx.globalAlpha = alpha * 0.35;
      fir(x, GROUND, 60 + r * 40, '#3d4f6e', '#5a6f96');
      ctx.restore();
    }
    const SP4 = 150;
    const u0 = Math.floor(px / SP4) - 1, u1 = u0 + Math.ceil(W / SP4) + 3;
    for (let i = u0; i <= u1; i++) {
      if (biomeAt(i * SP4) !== 2) continue;
      const x = i * SP4 - px, r = rnd(i);
      if (r > 0.72) {
        const h = 80 + r * 40;
        ctx.fillStyle = '#e8e4da';
        ctx.fillRect(x - 4, GROUND - h, 8, h);
        ctx.fillStyle = PAL.pole;
        for (let k = 0; k < 4; k++) ctx.fillRect(x - 4, GROUND - h + 10 + k * (h - 16) / 4, 8, 2);
        ctx.fillStyle = PAL.autumn;
        ctx.beginPath();
        ctx.arc(x, GROUND - h - 12, 20, 0, Math.PI * 2);
        ctx.arc(x - 14, GROUND - h - 2, 14, 0, Math.PI * 2);
        ctx.arc(x + 14, GROUND - h - 4, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.arc(x + 6, GROUND - h - 14, 10, 0, Math.PI * 2); ctx.fill();
      } else {
        fir(x, GROUND, 95 + r * 70, '#3a2b1d', r > 0.4 ? '#1f4f3a' : '#1c2748');
        ctx.strokeStyle = '#2e5e3a'; ctx.lineWidth = 1.5;
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath(); ctx.moveTo(x + k * 5, GROUND);
          ctx.quadraticCurveTo(x + k * 6, GROUND - 6, x + k * 8, GROUND - 9); ctx.stroke();
        }
      }
      if (i % 6 === 2 && r > 0.3) {
        ctx.fillStyle = '#6b4a2a';
        ctx.fillRect(x + 30, GROUND - 34, 5, 34);
        ctx.fillStyle = '#8a6238';
        ctx.beginPath(); ctx.roundRect(x + 16, GROUND - 48, 36, 18, 2); ctx.fill();
        ctx.strokeStyle = '#5a3d20'; ctx.lineWidth = 1;
        ctx.strokeRect(x + 16, GROUND - 48, 36, 18);
        ctx.fillStyle = '#2b1c0e';
        ctx.font = '500 9px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('S.I.T', x + 34, GROUND - 36);
      }
    }
    ctx.restore();
  };

  const step = (dt) => {
    if (!state.alive || !state.started || state.won) return;
    state.t += dt;
    state.speed = Math.min(760, state.speed + (10 + Math.min(14, state.score / 120)) * dt);
    state.dist += state.speed * dt;
    state.score = state.dist / 12 * mult();
    if (state.score >= WIN_SCORE) { state.won = true; return; }

    if (!(state.ducking && state.y >= GROUND)) state.vy += G * dt;
    state.y += state.vy * dt;
    if (state.y >= GROUND) { state.y = GROUND; state.vy = 0; }

    if (state.dist > state.nextCloud) {
      state.clouds.push({ x: W + 60, y: 30 + Math.random() * 110 });
      state.nextCloud = state.dist + 300 + Math.random() * 400;
    }
    state.clouds = state.clouds.filter(c => (c.x -= state.speed * 0.25 * dt) > -80);

    spawnPole();
    const px = PX, py = state.y;
    for (const p of state.poles) {
      p.x -= state.speed * dt;
      // убивает только луч камеры — сам столб можно пролетать
      if (state.alive) {
        for (const [ox, oy] of [[0, 0], [PR, 0], [-PR, 0], [0, -PR], [0, PR]]) {
          if (inBeam(p, px + ox, py + oy)) { state.alive = false; break; }
        }
      }
    }
    if (!state.alive) {
      best = Math.max(best, Math.floor(state.score));
      localStorage.setItem('pumpkin-dino-best', best);
    }
    state.poles = state.poles.filter(p => p.x > -80);
    hud();
  };

  const drawPumpkin = () => {
    const squashed = state.ducking && state.y >= GROUND;
    const cx = PX, cy = state.y - (squashed ? 9 : PR);
    ctx.save(); ctx.translate(cx, cy);
    ctx.rotate(state.dist / 22); // тыква катится
    ctx.fillStyle = PAL.pumpkin;
    ctx.beginPath(); ctx.ellipse(0, 0, squashed ? 18 : 15, squashed ? 10 : 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.pumpkinDark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 8, squashed ? 10 : 14, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, squashed ? -10 : -14); ctx.lineTo(0, squashed ? -16 : -19);
    ctx.lineWidth = 4; ctx.strokeStyle = PAL.stem; ctx.stroke();
    ctx.restore();
  };

  const draw = () => {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, PAL.sky1); g.addColorStop(1, PAL.sky2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PAL.cloud;
    for (const c of state.clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 26, 0, Math.PI * 2);
      ctx.arc(c.x + 30, c.y + 7, 20, 0, Math.PI * 2);
      ctx.arc(c.x - 30, c.y + 9, 19, 0, Math.PI * 2);
      ctx.arc(c.x + 4, c.y - 10, 16, 0, Math.PI * 2);
      ctx.fill();
    }
    // фон: биомы сменяются резко, без переливов
    const bgp = state.dist / BIOME_LEN;
    const i0 = Math.floor(bgp) % BIOMES.length;
    drawBiome(1);

    // дорога
    ctx.fillStyle = PAL.road; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = PAL.roadEdge; ctx.fillRect(0, GROUND, W, 4); ctx.fillRect(0, H - 14, W, 4);
    ctx.fillStyle = PAL.roadLine;
    for (let i = 0; i < W / 90 + 2; i++) {
      const dx = i * 90 - (state.dist % 90);
      ctx.fillRect(dx, GROUND + (H - GROUND) / 2 - 2, 44, 4);
    }
    // столбы с камерами и зоны наблюдения
    for (const p of state.poles) {
      const camY = GROUND - p.h;
      const active = beamState(p);
      const b = beamGeom(p);
      // зона наблюдения: треугольник от камеры, с градиентом и пульсом
      const pulse = 0.82 + 0.18 * Math.sin(state.t * 6 + p.x * 0.01);
      const grad = ctx.createLinearGradient(b.cx, b.cy, b.x2, b.y2);
      grad.addColorStop(0, `rgba(210,31,44,${0.38 * pulse})`);
      grad.addColorStop(0.55, `rgba(210,31,44,${0.16 * pulse})`);
      grad.addColorStop(1, 'rgba(210,31,44,0.04)');
      ctx.beginPath();
      ctx.moveTo(b.cx, b.cy);
      ctx.lineTo(b.a1x, b.a1y);
      ctx.lineTo(b.a2x, b.a2y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = `rgba(210,31,44,${0.55 * pulse})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // реалистичный столб: тумба с болтами, конусная стойка, изогнутый кронштейн
      const g2 = ctx.createLinearGradient(p.x - 6, 0, p.x + 6, 0);
      g2.addColorStop(0, '#3a4148'); g2.addColorStop(0.5, PAL.pole); g2.addColorStop(1, '#3a4148');
      // тумба
      ctx.fillStyle = PAL.pole;
      ctx.beginPath();
      ctx.moveTo(p.x - 11, GROUND);
      ctx.lineTo(p.x - 7, GROUND - 16);
      ctx.lineTo(p.x + 7, GROUND - 16);
      ctx.lineTo(p.x + 11, GROUND);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5a636c'; // болты
      ctx.fillRect(p.x - 8, GROUND - 4, 3, 3); ctx.fillRect(p.x + 5, GROUND - 4, 3, 3);
      // конусная стойка
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(p.x - 6, GROUND - 16);
      ctx.lineTo(p.x - 2.6, camY);
      ctx.lineTo(p.x + 2.6, camY);
      ctx.lineTo(p.x + 6, GROUND - 16);
      ctx.closePath(); ctx.fill();
      // распределительная коробка
      ctx.fillStyle = PAL.pole;
      ctx.beginPath(); ctx.roundRect(p.x - 5, GROUND - 40, 10, 14, 2); ctx.fill();
      ctx.strokeStyle = '#3a4148'; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - 5, GROUND - 40, 10, 14);
      // изогнутый кронштейн, камера свисает с его конца
      ctx.strokeStyle = PAL.pole; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, camY + 4);
      ctx.quadraticCurveTo(p.x + 2, camY - 12, p.x + 17, camY - 8);
      ctx.stroke();
      // камера на конце кронштейна, направлена по лучу
      ctx.save();
      ctx.translate(p.x + 17, camY - 6);
      ctx.rotate(p.angle);
      ctx.fillStyle = PAL.camBody;
      ctx.beginPath(); ctx.roundRect(-10, -7, 22, 14, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; // блик на корпусе
      ctx.beginPath(); ctx.roundRect(-8, -6, 18, 4, 2); ctx.fill();
      ctx.fillStyle = PAL.camLens;
      ctx.beginPath(); ctx.arc(10, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; // блик на линзе
      ctx.beginPath(); ctx.arc(11, -1.2, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.camLens;
      ctx.fillRect(-13, -3, 4, 6); // крепление сзади
      ctx.fillStyle = active ? PAL.camBlink : 'rgba(0,0,0,0.25)';
      if (active) {
        // свечение сигнального огонька
        ctx.save(); ctx.globalAlpha = 0.3 + 0.15 * Math.sin(state.t * 6);
        ctx.beginPath(); ctx.arc(-5, -3, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(-5, -3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawPumpkin();

    ctx.textAlign = 'center';
    if (state.won) {
      ctx.fillStyle = 'rgba(15,15,30,0.8)'; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) {
        const x = (i * 173 + Math.sin(state.t * 2 + i) * 30) % W;
        const y = (i * 97 + state.t * 60 + i * i * 7) % H;
        ctx.fillStyle = i % 3 === 0 ? PAL.pumpkin : (i % 3 === 1 ? PAL.camBody : '#ffffff');
        ctx.beginPath(); ctx.arc(x, y, 3 + (i % 3), 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#ffffff';
      ctx.font = '500 26px system-ui, sans-serif';
      ctx.fillText('1 000 000 000!', W / 2, H / 2 - 24);
      ctx.font = '400 15px system-ui, sans-serif';
      ctx.fillText('Тыква обошла все камеры. Ты победил!', W / 2, H / 2 + 8);
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.fillStyle = PAL.zoneOff;
      ctx.fillText('клик — сыграть ещё раз', W / 2, H / 2 + 34);
    } else if (!state.alive) {
      ctx.fillStyle = PAL.overlay; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.font = '500 22px system-ui, sans-serif';
      ctx.fillText('G A M E   O V E R', W / 2, H / 2 - 12);
      ctx.font = '400 14px system-ui, sans-serif';
      ctx.fillText('Счёт: ' + Math.floor(state.score).toLocaleString('ru-RU') + ' · Рекорд: ' + best.toLocaleString('ru-RU') + ' · клик — заново', W / 2, H / 2 + 16);
    } else if (!state.started) {
      ctx.fillStyle = '#2b5e7d';
      ctx.font = '400 14px system-ui, sans-serif';
      ctx.fillText('Пробел или клик — побежали', W / 2, H / 2 - 30);
    }
  };

  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  };
  reset(); requestAnimationFrame(loop);

  const restart = () => { reset(); };
  root.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    if (!state.alive) restart(); else jump();
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea,select,button')) return;
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (!state.alive) restart(); else jump();
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (state.y >= GROUND) state.ducking = true; }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') state.ducking = false;
  });
  document.getElementById('pd-restart').addEventListener('click', restart);
})();
</script>

</div>
</body>
</html>
